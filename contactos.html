<!-- Início do form contactos -->
<form class="mx-auto col-6" id="formulario">
  <div class="titulo-contacto"><h1>Contacta-nos</h1></div>
  <div class="form-group mt-3">
    <label>Nome:</label>
    <input type="text" id="Nome" class="form-control labels" placeholder="Insira o seu nome">
    <div class="Invalid" style="display:none; color:red;"></div> 
  </div>
  <div class="form-group my-3">
    <label>Email:</label>
    <input type="email" id="email" class="form-control labels" placeholder="Insira o seu email">
    <div class="Invalid" style="display:none; color:red;"></div>
  </div>
  <label>Comenta:</label>
  <textarea id="Mensagem" class="form-control labels" rows="5" placeholder="Insira a sua dúvida!"></textarea>
  <div class="Invalid" style="display:none; color:red;"></div>

  <button type="submit" class="botao-enviar">Enviar</button>
</form>
<!-- Fim do form contactos -->
