        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>

        </li>
      </ul>
    </div>
  </div>

<h1>Países</h1>
<!-- Inicio da barra de pesquisa -->
<div class="search-wrapper">
  <div class="search-box">
      <i class="fas fa-search search-icon"></i>
      <input type="text" class="form-control search-input" placeholder="Escreve um país..." id="titulo"> 
      <button class="btn btn-primary search-button" id="btn"> 
              Procurar
      </button>
  </div>
</div>

<!-- Inicio das cards dos paises -->
<div class="row lista_paises"> 
  <!-- Este card ira ser duplicado por cada país encontrado -->
  <div class="col-5 espaçamento card_paises">
    <div class="card">
      <img src="img/portugal-paisagem.webp" class="imagem" alt="Bandeira do País"/>
      <div class="card_body">
        <h5 class="titulo_card">Nome</h5>
        <b class="capital">Capital:</b>
        <br>
        <b class="regiao">Continente:</b>
        <br>
        <b class="moeda">Moeda:</b>
        <br>
        <div class="botao_adicionar_favoritos">
          <button type="button" class="btn btn-outline-primary" onclick='favoritos({/* informações do país */})'>Adicionar favoritos</button>
        </div>
        <div class="botao_detalhes">
          <button type="button" class="btn btn-outline-primary" onclick='abrirModal({/* informações do país */})'>Abrir</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalCard" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
  <div class="modal-dialog">
      <div class="modal-content">
          <div class="modal-header">
              <h5 class="modal-title" id="modalLabel">Detalhes do País</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="modalBody">
              <!-- O conteúdo do modal será preenchido pela função abrirModal -->
          </div>
          <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
          </div>
      </div>
  </div>
</div>

<!-- Incio do footer -->

<div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.05);">
  <footer class="bg-body-tertiary text-center">
    <div class="container p-4 pb-0">
      <!-- Inicio dos links do footer -->
       <section class="mb-2">
        <img src="img/logo.png" alt="Logo" width="150" height="60">
       </section>
       <section class="mb-3">
        <ul class="nav justify-content-center border-bottom pb-3 mb-3">
          <a class="nav-footer nav-link active" href="index.html">Home</a>
          <a class="nav-footer nav-link active" href="paises.html">Paises</a>
          <a class="nav-footer nav-link active" href="loja.html">Loja</a>
          <a class="nav-footer nav-link active" href="sobre.html">Sobre</a>
          <a class="nav-footer nav-link active" href="contactos.html">Contactos</a>
        </ul>
        <!-- Fim dos links do footer-->
       </section>
      <section class="mb-4">
       <!--Logos das redes sociais-->
          <img src="img/insta-logo.png" alt="Instagram">
          <img src="img/facebook-logo.png" alt="Facebook">
          <img src="img/linkdlin-logo.png" alt="Linkedin">
          <img src="img/twitter-logo.png" alt="Twitter">
      </section>
      <!-- Fim dos logos das redes socias -->
    </div>

</div>
